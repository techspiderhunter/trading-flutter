<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Royal Blue Gradient for Left & Right M Pillars -->
    <linearGradient id="moneyaraBlue" x1="0%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#104AE8"/>
      <stop offset="50%" stop-color="#1E67FA"/>
      <stop offset="100%" stop-color="#3B8BFF"/>
    </linearGradient>

    <!-- Sky Blue / Cyan Gradient for Dynamic Upward Arrow Ribbon -->
    <linearGradient id="moneyaraCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080FF"/>
      <stop offset="60%" stop-color="#00BAFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Vibrant Emerald / Teal Green for Growth Bar Chart -->
    <linearGradient id="moneyaraGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00A86B"/>
      <stop offset="100%" stop-color="#00D08A"/>
    </linearGradient>

    <!-- Subtle Premium Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E67FA" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Moneyara Brand Symbol -->
  <g id="logo-symbol" filter="url(#logoShadow)">
    <!-- 1. Left Vertical Stem of M -->
    <rect x="150" y="160" width="48" height="125" rx="24" fill="url(#moneyaraBlue)"/>

    <!-- 2. Right Vertical Stem of M -->
    <rect x="302" y="180" width="48" height="105" rx="24" fill="url(#moneyaraBlue)"/>

    <!-- 3. Dynamic Upward Diagonal Ribbon & Arrow (Cyan) -->
    <path d="M198,240 C210,215 235,190 268,170 L345,120 L378,145 L382,90 L325,105 L350,125 L285,170 C248,195 215,222 198,240 Z" fill="url(#moneyaraCyan)"/>
    <!-- Arrow Head -->
    <polygon points="328,95 392,72 376,138 358,118 338,135 325,115" fill="url(#moneyaraCyan)"/>

    <!-- 4. Inner Growth Bars (Teal / Emerald Green) -->
    <!-- Bar 1 (Short) -->
    <rect x="214" y="260" width="20" height="28" rx="8" fill="url(#moneyaraGreen)"/>
    <!-- Bar 2 (Medium) -->
    <rect x="242" y="244" width="20" height="44" rx="8" fill="url(#moneyaraGreen)"/>
    <!-- Bar 3 (Tall) -->
    <rect x="270" y="225" width="20" height="63" rx="8" fill="url(#moneyaraGreen)"/>
  </g>

  <!-- Brand Typography: Moneyara RESEARCH -->
  <g id="brand-text" transform="translate(0, 310)">
    <!-- Moneyara Main Wordmark -->
    <text x="250" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Manrope', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="54" letter-spacing="-1.2" fill="#0A1C3E">Moneyara</text>
    
    <!-- Subtitle: — RESEARCH — -->
    <g transform="translate(0, 96)">
      <!-- Left Dash -->
      <line x1="90" y1="-5" x2="140" y2="-5" stroke="#1A62FF" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Word RESEARCH -->
      <text x="250" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Manrope', sans-serif" font-weight="800" font-size="21" letter-spacing="8" fill="#1A62FF">RESEARCH</text>
      <!-- Right Dash -->
      <line x1="360" y1="-5" x2="410" y2="-5" stroke="#1A62FF" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
